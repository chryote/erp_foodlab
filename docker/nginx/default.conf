server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 10M;

    location ^~ /api {
        error_page 400 = @api_json_400;
        error_page 408 = @api_json_408;
        error_page 413 = @api_json_413;
        error_page 414 = @api_json_414;
        error_page 500 = @api_json_500;
        error_page 502 = @api_json_502;
        error_page 503 = @api_json_503;
        error_page 504 = @api_json_504;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location @api_json_400 {
        default_type application/json;
        return 400 '{"message":"Bad request."}';
    }

    location @api_json_408 {
        default_type application/json;
        return 408 '{"message":"Request timeout."}';
    }

    location @api_json_413 {
        default_type application/json;
        return 413 '{"message":"Payload too large. Maximum allowed request size is 10MB.","errors":{"document":["The uploaded payload exceeds the maximum allowed size of 10MB."]}}';
    }

    location @api_json_414 {
        default_type application/json;
        return 414 '{"message":"URI too long."}';
    }

    location @api_json_500 {
        default_type application/json;
        return 500 '{"message":"Internal server error."}';
    }

    location @api_json_502 {
        default_type application/json;
        return 502 '{"message":"Bad gateway."}';
    }

    location @api_json_503 {
        default_type application/json;
        return 503 '{"message":"Service unavailable."}';
    }

    location @api_json_504 {
        default_type application/json;
        return 504 '{"message":"Gateway timeout."}';
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream "app:9000";
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
