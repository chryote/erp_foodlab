global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: "erp_foodlab"

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "laravel_api"
    metrics_path: "/api/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["nginx:80"]
        labels:
          app: "erp-foodlab-backend"
          environment: "local"

  - job_name: "redis_exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
